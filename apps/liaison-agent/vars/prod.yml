namespace: prod
app_name: diligence-kit-liaison-agent
image_registry: us-central1-docker.pkg.dev/your-gcp-project-id/diligence-kit-artifacts
image_name: diligence-kit-liaison-agent-prod
image_tag: latest
service_account: diligence-kit-liaison-agent
gcp_service_account: diligence-kit@your-gcp-project-id.iam.gserviceaccount.com
replicas: 1
container_port: 8000
service_port: 8000
service_type: ClusterIP

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 2Gi

secrets:
  gcp:
    project_id: diligence-kit-liaison-gcp-project-id-prod
    location: diligence-kit-liaison-gcp-location-prod
  database:
    url: diligence-kit-liaison-database-url-prod
  app:
    api_key: diligence-kit-liaison-api-key-prod
    env: diligence-kit-liaison-env-prod
    log_level: diligence-kit-liaison-log-level-prod

health_check:
  path: /health
  liveness:
    initial_delay: 60
    period: 30
    timeout: 10
    failure_threshold: 5
  readiness:
    initial_delay: 30
    period: 15
    timeout: 5
    failure_threshold: 3
