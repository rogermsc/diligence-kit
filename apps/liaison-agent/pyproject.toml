[tool.poetry]
name = "diligence-kit-liaison-agent"
version = "0.1.0"
license = "MIT"
description = "Diligence Kit Liaison Agent - intelligent ombudsman and support chat"
authors = ["Diligence Kit Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
langchain = "^0.3.0"
langchain-google-vertexai = "^2.0.0"
langgraph = "^0.2.0"
pydantic-settings = "^2.6.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"
google-cloud-logging = "^3.13.0"
sqlalchemy = "^2.0.45"
asyncpg = "^0.31.0"
alembic = "^1.18.0"
greenlet = "^3.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

