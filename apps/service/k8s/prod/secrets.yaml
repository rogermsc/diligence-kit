apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcpsm-secret-store
  namespace: prod
spec:
  provider:
    gcpsm:
      projectID: "your-gcp-project-id"
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: your-gke-cluster
          serviceAccountRef:
            name: diligence-kit-service
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: diligence-kit-db-secret
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm-secret-store
    kind: SecretStore
  target:
    name: diligence-kit-db-secret
    creationPolicy: Owner
  data:
    - secretKey: database-username
      remoteRef:
        key: diligence-kit-service-db-username-prod
    - secretKey: database-password
      remoteRef:
        key: diligence-kit-service-db-password-prod
    - secretKey: database-url
      remoteRef:
        key: diligence-kit-service-database-url-prod
---
