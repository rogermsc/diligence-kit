apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcpsm-secret-store
  namespace: prod
spec:
  provider:
    gcpsm:
      projectID: "your-gcp-project-id"
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: your-gke-cluster
          serviceAccountRef:
            name: diligence-kit-web
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: diligence-kit-web-secret
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcpsm-secret-store
    kind: SecretStore
  target:
    name: diligence-kit-web-secret
    creationPolicy: Owner
  data:
    - secretKey: api-base-url
      remoteRef:
        key: diligence-kit-web-api-base-url-prod

