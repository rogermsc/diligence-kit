apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: diligence-kit-web
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: diligence-kit-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
