name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: service + web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client is generated into node_modules and is not committed, so
      # anything that imports it fails to typecheck without this.
      - run: pnpm --filter diligence-kit-service exec prisma generate

      - run: pnpm build

      # `pnpm build` compiles src only — tsconfig.build.json excludes test/ and
      # spec files. A 517-line e2e spec sat broken and invisible for exactly that
      # reason, so typecheck the whole project too.
      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  python:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [agent, liaison-agent]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt ruff pytest pytest-asyncio
          else
            pip install ruff pytest pytest-asyncio
            pip install poetry && poetry install --no-root
          fi

      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: ruff check .

      # Not every app has tests yet. Absent tests must not read as passing tests,
      # so say which case this is rather than exiting 0 silently.
      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "::warning title=No tests::apps/${{ matrix.app }} has no tests/ directory"
          fi
