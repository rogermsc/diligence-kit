name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: service + web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client is generated into node_modules and is not committed, so
      # anything that imports it fails to typecheck without this.
      - run: pnpm --filter diligence-kit-service exec prisma generate

      - run: pnpm build

      # `pnpm build` compiles src only — tsconfig.build.json excludes test/ and
      # spec files. A 517-line e2e spec sat broken and invisible for exactly that
      # reason, so typecheck the whole project too.
      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  python:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [agent, liaison-agent]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # The liaison agent's own dependencies are managed with Poetry.
          if [ -f pyproject.toml ]; then
            pip install poetry
            poetry config virtualenvs.create false
            poetry install --no-root --no-interaction
          fi

      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: ruff check .

      # Absent tests must never read as passing tests.
      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ ! -d tests ]; then
            echo "::error title=No tests::apps/${{ matrix.app }} has no tests/ directory"
            exit 1
          fi
          pytest -q
