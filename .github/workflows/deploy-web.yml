name: Diligence Kit Web - Deploy

# Triggered by the orchestrator (.github/workflows/deploy.yml) on push, or
# manually via workflow_dispatch for a single-app deploy.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options: [prod]

env:
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: diligence-kit-artifacts
  IMAGE_NAME: diligence-kit-web-prod
  GKE_CLUSTER: your-gke-cluster
  GKE_REGION: us-central1
  NAMESPACE: prod
  DEPLOYMENT_NAME: diligence-kit-web
  APP_DIR: apps/web
  # NEXT_PUBLIC_* values are inlined by Next.js at build time, so they must be
  # passed as a --build-arg here. Stored in GSM as diligence-kit-web-api-base-url-prod.
  API_BASE_URL_SECRET: diligence-kit-web-api-base-url-prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f  # v2.1.7
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2.2.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c  # v2.3.5
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Fetch NEXT_PUBLIC_API_BASE_URL build secret
        id: build_secret
        run: |
          API_BASE_URL=$(gcloud secrets versions access latest --secret="${{ env.API_BASE_URL_SECRET }}")
          echo "::add-mask::${API_BASE_URL}"
          echo "value=${API_BASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          docker build \
            -f ${{ env.APP_DIR }}/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL='${{ steps.build_secret.outputs.value }}' \
            -t ${{ env.REGISTRY }}/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          docker push \
            ${{ env.REGISTRY }}/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Capture image digest
        id: image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_TAG}" | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Patch deployment manifest with digest
        run: |
          sed -i \
            "s|${{ env.IMAGE_NAME }}:latest|${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}|" \
            ${{ env.APP_DIR }}/k8s/prod/deployment.yaml

      - name: Apply k8s manifests
        run: kubectl apply -f ${{ env.APP_DIR }}/k8s/prod/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s
