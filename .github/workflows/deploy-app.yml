name: Deploy one app

# One workflow for all four apps. They were four files of 91 identical lines
# differing only in the image name, the deployment name and the directory —
# and, for the web app, one extra build-arg.
#
# Called by the orchestrator (deploy.yml), or run directly for a single app.
on:
  workflow_call:
    inputs:
      app:
        description: Directory under apps/
        required: true
        type: string
      build_context:
        description: >-
          Docker build context. The web image needs the repository root because
          it builds inside the pnpm workspace; the others build from their own
          directory.
        required: false
        default: ""
        type: string
      build_secret:
        description: >-
          GSM secret to fetch and pass as NEXT_PUBLIC_API_BASE_URL. Only the web
          app sets this: Next.js inlines NEXT_PUBLIC_* at build time, so it
          cannot be supplied at runtime like every other value.
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      app:
        description: Directory under apps/
        required: true
        type: choice
        options: [agent, service, web, liaison-agent]

env:
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: diligence-kit-artifacts
  GKE_CLUSTER: your-gke-cluster
  GKE_REGION: us-central1
  NAMESPACE: prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      APP_DIR: apps/${{ inputs.app }}
      IMAGE_NAME: diligence-kit-${{ inputs.app }}-prod
      DEPLOYMENT_NAME: diligence-kit-${{ inputs.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f  # v2.1.7
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2.2.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c  # v2.3.5
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Fetch build secret
        id: build_secret
        if: inputs.build_secret != ''
        run: |
          VALUE=$(gcloud secrets versions access latest --secret="${{ inputs.build_secret }}")
          echo "::add-mask::${VALUE}"
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          ARGS=(-t "${IMAGE}" -f "${{ env.APP_DIR }}/Dockerfile")
          if [ -n "${{ inputs.build_secret }}" ]; then
            ARGS+=(--build-arg "NEXT_PUBLIC_API_BASE_URL=${{ steps.build_secret.outputs.value }}")
          fi
          docker build "${ARGS[@]}" "${{ inputs.build_context || env.APP_DIR }}"

      - name: Push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          docker push \
            ${{ env.REGISTRY }}/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Capture image digest
        id: image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${PROJECT_ID}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_TAG}" | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Patch deployment manifest with digest
        run: |
          sed -i \
            "s|${{ env.IMAGE_NAME }}:latest|${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}|" \
            ${{ env.APP_DIR }}/k8s/prod/deployment.yaml

      - name: Apply k8s manifests
        run: kubectl apply -f ${{ env.APP_DIR }}/k8s/prod/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s
